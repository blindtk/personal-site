language: javascript
# libFuzzer é o único engine para JavaScript. Isto sozinho não impedia o
# run_fuzzers de apanhar os wrappers do honggfuzz como alvos (vinham da
# cópia de $SRC para $OUT/src com sanitizer: coverage) — isso resolve-se
# no Dockerfile, ver o comentário do `RUN rm -rf $SRC/honggfuzz`.
fuzzing_engines:
  - libfuzzer
