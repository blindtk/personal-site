# Release assinada (Sigstore) para o Scorecard reconhecer Signed-Releases —
# não faz deploy nenhum: o Worker continua manual (npx wrangler deploy à
# mão, ver dynamic/PLAN.md), este workflow só empacota o que já passou no CI
# (ci.yml) e assina a proveniência dos tarballs com
# actions/attest-build-provenance (build_fuzzers/run_fuzzers idem para o
# alerta de Fuzzing, ver fuzzing.yml). O dono cria a tag manualmente depois
# de fazer o deploy à mão.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para (re)criar a release (ex.: v2026.08.01) — corre o workflow a partir dessa tag'
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      # obrigatório para assinar a proveniência (Sigstore), mesma razão do
      # id-token: write no Scorecard.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # package-manager-cache: false, explícito — zizmor apanhou
          # (cache-poisoning, severidade alta) que o setup-node cacheia por
          # omissão (mesmo sem `cache: 'npm'`), e uma cache envenenada é
          # vetor de execução de código num workflow que publica
          # artefactos assinados a partir de uma tag. Este workflow corre
          # raramente (só em tag/manual); a velocidade não compensa o risco.
          package-manager-cache: false
      #
      # --ignore-scripts: mesma proteção do ci.yml (nenhuma dependência corre
      # postinstall arbitrário).
      - name: Build static/
        working-directory: static
        run: |
          npm ci --ignore-scripts
          npm run build
          tar -czf ../site-dist.tar.gz dist

      # SBOM (CycloneDX) do que está de facto instalado — mesmo padrão do
      # supply-chain.yml, não uma ferramenta diferente.
      - name: SBOM de static/
        working-directory: static
        run: npm sbom --sbom-format cyclonedx > sbom-static.cdx.json

      # `wrangler deploy --dry-run --outdir` compila e devolve o bundle sem
      # publicar (sem segredos, mesmo gate sem-credenciais do ci.yml) — é
      # este bundle que fica anexado à Release, nunca um deploy real.
      - name: Empacotar dynamic/worker/ (dry-run, sem deploy)
        working-directory: dynamic/worker
        run: |
          npm ci --ignore-scripts
          npx wrangler deploy --dry-run --outdir=worker-out
          tar -czf ../../worker-bundle.tar.gz -C worker-out .

      - name: SBOM de dynamic/worker/
        working-directory: dynamic/worker
        run: npm sbom --sbom-format cyclonedx > sbom-worker.cdx.json

      - name: Assinar proveniência (Sigstore)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: '*.tar.gz'

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            site-dist.tar.gz
            worker-bundle.tar.gz
            static/sbom-static.cdx.json
            dynamic/worker/sbom-worker.cdx.json
