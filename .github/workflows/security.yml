# Verificações de segurança do repositório. Complementa o ci.yml (build):
# aqui vivem supply chain, segredos e SAST. Todas as actions estão pinadas
# por commit SHA (o Renovate mantém os digests atualizados).
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nada por omissão — cada job declara o mínimo de que precisa.
permissions: {}

jobs:
  # Dependências com vulnerabilidades conhecidas (base OSV.dev, inclui as
  # advisories do GitHub). Analisa o lockfile e falha o CI se houver vuln;
  # o SARIF alimenta o separador Security → Code scanning.
  osv-scanner:
    permissions:
      # exigidas pelo workflow reutilizável chamado
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=./static/package-lock.json

  # Segredos committados (tokens Cloudflare, chaves privadas, …). Corre
  # sobre a história completa (fetch-depth: 0) para apanhar segredos
  # introduzidos em qualquer commit do PR, não só no último. Existe também
  # como hook local (.pre-commit-config.yaml) — o CI é a rede de segurança.
  # Conta pessoal: GITLEAKS_LICENSE não é necessária.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
