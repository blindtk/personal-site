# Verificações de segurança do repositório. Complementa o ci.yml (build):
# aqui vivem supply chain, segredos e SAST. Todas as actions estão pinadas
# por commit SHA (o Renovate mantém os digests atualizados).
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nada por omissão — cada job declara o mínimo de que precisa.
permissions: {}

jobs:
  # Dependências com vulnerabilidades conhecidas (base OSV.dev, inclui as
  # advisories do GitHub). Analisa os DOIS lockfiles do repo (static/ e
  # dynamic/worker/ — este 2.º só entrou em 2026-07, revisão de segurança:
  # antes disso, o wrangler/miniflare/sharp do Worker não era coberto por
  # nada aqui) e falha o CI se houver vuln (o osv-scanner sai com código
  # ≠0; sem vuln sai 0 e o job passa).
  #
  # Chamamos a *action* diretamente em vez do workflow reutilizável oficial:
  # esse workflow, por dentro, usa actions/download-artifact e
  # github/codeql-action/upload-sarif, pinadas por tag (não por SHA) do lado
  # do próprio workflow reutilizável — a allowlist de Actions e o "pin por
  # SHA obrigatório" deste repo fariam o CI recusar essas transitivas. A
  # action direta, pinada por SHA e coberta pela allowlist
  # (google/osv-scanner-action/*), mantém a deteção sem essa dependência.
  # (Nota histórica: até o repo ficar público, havia uma segunda razão — o
  # upload de SARIF para Security → Code scanning exigia GitHub Advanced
  # Security. Já não se aplica; ver codeql.yml e scorecard.yml, que publicam
  # SARIF diretamente.)
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          # --config: exceções em osv-scanner.toml (na raiz). Cada IgnoredVuln
          # traz justificação e data de expiração — usar só para falsos
          # positivos.
          scan-args: |-
            --config=./osv-scanner.toml
            --lockfile=./static/package-lock.json
            --lockfile=./dynamic/worker/package-lock.json

  # Segredos committados (tokens Cloudflare, chaves privadas, …). Corre
  # sobre a história completa (fetch-depth: 0) para apanhar segredos
  # introduzidos em qualquer commit do PR, não só no último. Existe também
  # como hook local (.pre-commit-config.yaml) — o CI é a rede de segurança.
  # Conta pessoal: GITLEAKS_LICENSE não é necessária.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # a gitleaks-action enumera os commits do PR pela API em eventos
      # pull_request — sem isto responde 403 "Resource not accessible"
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST (Semgrep): regras públicas de TS/JS + regras próprias em modo
  # generic para os <script> dos componentes .astro (.semgrep/). Foco:
  # sinks de DOM XSS (innerHTML, document.write, insertAdjacentHTML) nas
  # ferramentas client-side, no terminal do Lab e nos Workers futuros.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Semgrep
        run: pipx install semgrep==1.173.0
      - name: SAST
        # Gate a ERROR **e** WARNING (era só ERROR até à triagem de 2026-07,
        # ver docs/security-review-2026-07-29.md). O volume real medido contra
        # este código, a correr sem filtro de severidade, foi de 16 achados:
        # 2 ERROR (dois ternários mortos — corrigidos, não suprimidos),
        # 8 WARNING (3 deles de categoria "security" — precisamente o que o
        # gate existe para apanhar) e 6 INFO. Depois da triagem: 0 achados.
        # O custo marginal de incluir WARNING é hoje zero e passa a cobrir as
        # regras de segurança que o Semgrep classifica abaixo de ERROR.
        #
        # INFO fica de fora: são regras de "audit" com confidence LOW cuja
        # recomendação típica é acrescentar uma dependência de sanitização —
        # não é sinal que justifique parar um PR.
        #
        # ATENÇÃO: `--severity` é um filtro de igualdade, não um mínimo. Só
        # com `--severity WARNING` os achados ERROR deixariam de contar — daí
        # as duas flags.
        #
        # Pin (ou a falta dele): p/typescript e p/javascript NÃO estão
        # pinadas por versão/digest, ao contrário de tudo o resto neste
        # ficheiro (actions por SHA, semgrep/zizmor por versão exata). Não é
        # descuido — é um limite real do Semgrep OSS: os pacotes `p/…` do
        # registo público (semgrep.dev) são bundles geridos do lado do
        # servidor, sem equivalente ao "commit SHA" das actions nem ao
        # "==versão" do pip, através do CLI open-source. Descoberto numa
        # revisão de segurança (2026-07, ronda 4, N4): o CI corre regras
        # remotas e mutáveis a cada execução, e uma falha de rede a meio
        # (semgrep.dev inacessível) bloqueava todos os PRs sem distinguir
        # "sem achados" de "não consegui verificar". Mitigado por:
        #   (a) as regras próprias em .semgrep/ (offline, ficheiro
        #       versionado, pinado com o resto do repo) cobrem o sink
        #       concreto que mais importa aqui (DOM XSS via innerHTML/
        #       outerHTML/document.write/insertAdjacentHTML);
        #   (b) o retry abaixo: só repete em erro de configuração/rede
        #       (exit 2 do semgrep — falha a obter `--config`), nunca num
        #       achado real (exit 1, com --error) — um 429/timeout
        #       transitório do semgrep.dev não bloqueia o merge, mas um
        #       achado ERROR/WARNING genuíno falha logo à primeira, sem
        #       mascarar.
        run: |
          set +e
          for tentativa in 1 2 3; do
            semgrep scan --metrics=off --error --severity ERROR --severity WARNING --config p/typescript --config p/javascript --config .semgrep/
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -eq 1 ]; then exit 1; fi
            echo "::warning::semgrep: erro de configuração/rede (tentativa ${tentativa}/3, exit=${code}) — a repetir…"
            sleep $((tentativa * 15))
          done
          exit "$code"

  # Auditoria dos próprios workflows: pins em falta, permissions excessivas,
  # injeção de template em run:, credenciais persistidas, tags impostoras.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar zizmor
        # 1.27.0 (a versão anterior aqui) foi RETIRADA do PyPI por advisory
        # de segurança (GHSA-f42p-wjw5-97qh) — apanhado numa revisão de
        # segurança ao tentar reproduzir este job localmente; já corrigido
        # noutro PR antes deste chegar a mergear.
        run: pipx install zizmor==1.29.0
      - name: Auditar workflows
        env:
          # permite as auditorias online (ex.: deteção de commits impostores)
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium .github/workflows/
