# ClusterFuzzLite (Jazzer.js) sobre as duas funções puras do Worker que
# processam bytes vindos de fora da rede sem qualquer confiança prévia:
# parseReports() (dynamic/worker/src/lib/csp-report.js) recebe o corpo bruto
# que qualquer browser de visitante pode enviar ao endpoint de relatórios
# CSP, e sanitizeText()/escapeHtml() (dynamic/worker/src/lib/sanitize.js) são
# os sanitizadores clássicos de output derivado de fontes externas. Ao
# contrário das ferramentas client-side de /ferramentas/ (sem rede, sem
# fronteira de confiança real), estas duas funções são a fronteira de
# confiança do Worker — daí serem o alvo, não as outras.
#
# Curto (60-120s por harness): o objetivo é o Scorecard reconhecer a
# integração de fuzzing, não substituir os testes com vetores conhecidos já
# existentes (node --test).
#
# SEM CRON, só workflow_dispatch — de propósito, não é o plano original.
# language: javascript + sanitizer: coverage (a única combinação de
# SANITIZER aceite tanto pelo script de compile do OSS-Fuzz como pelo
# validador da própria action — ver comentário no passo "Build fuzzers")
# acaba por compilar também binários de honggfuzz/AFL (infra genérica de
# C/C++ que a imagem base ainda arrasta, mesmo só sendo libFuzzer suportado
# para JS) e o run_fuzzers tenta correr esses binários como se fossem
# alvos do projeto — falham sempre a arrancar (execCC(): execvp('clang'):
# No such file or directory) e o job falha com "bugs" que não são dos
# nossos harnesses. Confirmado que não depende do commit da action pinada:
# tanto este pin como o HEAD atual de google/clusterfuzzlite apontam para a
# mesma imagem Docker flutuante (gcr.io/oss-fuzz-base/clusterfuzzlite-
# build-fuzzers:v1) — o bug vive dentro dela, não em nada deste repo.
# Tentado sem sucesso: sanitizer: none (rejeitado pela própria action),
# fuzzing_engines: [libfuzzer] em .clusterfuzzlite/project.yaml (ignorado
# por esta action — mesmo resultado com ou sem). Cron desligado até a
# Google corrigir a imagem publicada; corre manualmente (workflow_dispatch)
# de vez em quando para verificar se já passou a funcionar.
name: Fuzzing

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          # Jazzer.js corre em cima do V8/Node, não código nativo — não há
          # instrumentação ASan possível. O script de compile do OSS-Fuzz só
          # aceita 'coverage' ou 'none' para language: javascript (falha com
          # "cannot be fuzzed with sanitizers" para qualquer outro valor —
          # visto na 1.ª execução em produção, run #1 de 2026-08-01), mas o
          # próprio wrapper desta action só reconhece
          # address/memory/undefined/coverage como SANITIZER válido (rejeita
          # 'none' com "Invalid Configuration" — visto na 2.ª execução,
          # workflow_dispatch manual). 'coverage' é o único valor aceite por
          # ambas as camadas.
          sanitizer: coverage

      - name: Correr fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 2 harnesses (csp_report_fuzz, sanitize_fuzz); ~120s cada,
          # dentro do orçamento total abaixo.
          fuzz-seconds: 240
          mode: 'batch'
          output-sarif: true
