# Headers de segurança como garantia testada, não prometida: verifica a
# produção depois de cada deploy do Cloudflare Pages para a main (check run
# "Cloudflare Pages" concluído), num cron diário de rede de segurança, e à
# mão (workflow_dispatch, com URL opcional). A lista de headers esperados é
# versionada em .github/expected-headers.json.
#
# check_run, não deployment_status: este workflow ouviu deployment_status
# desde julho e nunca correu por esse evento (0 execuções até 2026-10-07) —
# a integração GitHub da Cloudflare publica um check run por deploy, não um
# Deployment, por isso a promessa "depois de cada deploy" só era cumprida
# pelo cron. O check_run corre sempre o workflow da branch por omissão
# (main), nunca o do commit que disparou o evento.
name: verify-headers

on:
  check_run:
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a verificar (por omissão: a do expected-headers.json)'
        required: false
        type: string

permissions: {}

jobs:
  check:
    # check_run dispara para TODOS os check runs concluídos que não venham
    # do próprio Actions (CodeQL, Cloudflare Pages dos previews, …) — só o
    # deploy de produção com sucesso interessa; os outros ficam "skipped".
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.name == 'Cloudflare Pages' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar headers em produção
        env:
          # valores externos entram por env e nunca interpolados no run: —
          # evita injeção de template (auditado pelo zizmor)
          TARGET_URL: ${{ inputs.url }}
          # Opcionais — Access Service Token (ver docs/cloudflare-deploy.md
          # e o comentário no topo de check-headers.mjs). Secrets em falta
          # chegam como string vazia, sem quebrar o comportamento atual.
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          # Segredo do bypass da regra WAF "CI headers check" (docs/
          # cloudflare-deploy.md §5, regra 2) — substitui o match por
          # User-Agent, que era uma string pública e spoofable. Os três
          # eventos correm o código da main contra a produção (o check_run
          # não tem URL de deploy: o alvo é sempre PROD_URL), por isso já não
          # há caso em que o token tenha de ficar de fora — antes ficava no
          # deployment_status, que corria o código do commit do deploy contra
          # *.pages.dev (auditoria de segurança 2026-09-25, não publicada).
          CI_WAF_TOKEN: ${{ secrets.CI_WAF_TOKEN }}
        run: node .github/scripts/check-headers.mjs
