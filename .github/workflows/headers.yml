# Headers de segurança como garantia testada, não prometida: verifica a
# produção depois de cada deploy do Cloudflare Pages (evento
# deployment_status, criado pela integração GitHub da Cloudflare), num cron
# diário de rede de segurança, e à mão (workflow_dispatch, com URL opcional).
# A lista de headers esperados é versionada em .github/expected-headers.json.
name: Headers

on:
  deployment_status:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a verificar (por omissão: a do expected-headers.json)'
        required: false
        type: string

permissions: {}

jobs:
  check:
    # em deployment_status só corre quando o deploy teve sucesso
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar headers em produção
        env:
          # valores externos entram por env e nunca interpolados no run: —
          # evita injeção de template (auditado pelo zizmor)
          TARGET_URL: ${{ inputs.url }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          # Opcionais — Access Service Token (ver docs/cloudflare-deploy.md
          # e o comentário no topo de check-headers.mjs). Secrets em falta
          # chegam como string vazia, sem quebrar o comportamento atual.
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          # Segredo do bypass da regra WAF "CI headers check" (docs/
          # cloudflare-deploy.md §5, regra 2) — substitui o match por
          # User-Agent, que era uma string pública e spoofable.
          CI_WAF_TOKEN: ${{ secrets.CI_WAF_TOKEN }}
        run: node .github/scripts/check-headers.mjs
