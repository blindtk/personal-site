# Build do site. Actions pinadas por commit SHA (o Renovate atualiza os
# digests); as verificações de segurança vivem em security.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nada por omissão — cada job declara o que precisa. Evita herdar o default
# do repo (que pode ser read-write) se o GITHUB_TOKEN for usado por engano.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # o token não fica gravado em .git/config depois do checkout
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: static/package-lock.json

      # --ignore-scripts: nenhuma dependência (nem transitiva) corre código
      # arbitrário no `npm ci` — o vetor mais comum de compromisso de pacotes
      # npm (postinstall malicioso). Verificado (revisão de segurança
      # 2026-07-29): nem o build/check/test do Astro nem `npm test` +
      # `wrangler deploy --dry-run` do Worker precisam de scripts de
      # instalação — só `wrangler dev`/`deploy` reais precisam (para obter o
      # binário do workerd), e esses continuam a correr manualmente fora
      # daqui (ver dynamic/PLAN.md). Se uma dependência futura passar a
      # exigir um postinstall real para o build/test funcionar, este passo
      # falha alto e explicitamente — nunca corre silenciosamente sem o
      # `--ignore-scripts` "por engano".
      - run: npm ci --ignore-scripts

      - run: npm run build

      # Verificação de tipos (Astro + TypeScript) — `npm run build` transpila
      # mas não falha em erros de tipo (é build rápido vs. type-check, opt-in
      # de propósito no Astro, tal como tsc build vs. tsc --noEmit). Ninguém
      # corria isto: apanhou 37 erros reais na primeira vez que se ligou —
      # incluindo strings de i18n em falta que ficavam "undefined" no HTML de
      # produção (ToolPage.astro, self-scan) e chaves i18n corretas mas
      # referenciadas do objeto errado (dict.security em vez de dict.evidence).
      - run: npm run check

      # Lógica pura (SubnetCalc, EXIF, MD5, encoding, geo, password, …) já
      # tinha testes escritos (node --test) que nenhum workflow corria — só
      # o pull_request_template.md pedia ao humano que confirmasse à mão.
      # Descoberto numa revisão de segurança (2026-07): um controlo que
      # depende de disciplina não é um controlo.
      - run: npm run test

      # Falha em advisories high/critical (o que nos apanhou desatualizados
      # da última vez); moderate/low com fix indisponível não bloqueiam CI.
      # Passa por check-npm-audit.mjs (não pelo `npm audit` cru): o npm
      # audit não tem mecanismo de exceção próprio, e um único falso
      # positivo (GHSA-hpcx-pg6g-x697/MAL-2026-10726, astro 7.1.0 —
      # descoberto ao ligar este mesmo passo) bloqueava todos os PRs sem
      # forma declarativa de o ignorar. Ver .github/npm-audit-allowlist.json.
      - run: node ../.github/scripts/check-npm-audit.mjs .

  worker:
    # Job próprio: package.json/lockfile e runtime (Cloudflare Workers)
    # separados do static — mesma lógica do osv-scanner (2 lockfiles) e do
    # labeler (área "dynamic" própria).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dynamic/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dynamic/worker/package-lock.json

      # --ignore-scripts: mesma proteção do job `build` (bloqueia postinstall
      # arbitrário). `npm test` e `wrangler deploy --dry-run` (abaixo) não
      # precisam de scripts de instalação — só `wrangler dev`/`deploy` reais
      # precisam (o binário do workerd), e esses continuam manuais.
      - run: npm ci --ignore-scripts

      # Lógica pura do Worker (sanitize, ratelimit, kvcap, aggregate, …) e
      # os testes de integração do fetch() sem rede — mesma lacuna do job
      # `build`, mesma correção.
      - run: npm test

      - run: node ../../.github/scripts/check-npm-audit.mjs .

      # Gate sem segredos: valida que o Worker compila, o wrangler.toml é
      # válido (nenhum binding em falta, nenhuma chave TOML engolida por
      # engano — já aconteceu neste ficheiro) e o bundle fica dentro do
      # limite de tamanho, SEM precisar do token da Cloudflare no CI. Não
      # substitui o deploy real (continua manual, ver dynamic/PLAN.md) — é
      # só o gate de "isto pelo menos monta-se" antes de chegar lá.
      - run: npx wrangler deploy --dry-run
