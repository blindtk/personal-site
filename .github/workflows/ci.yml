name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: este workflow só lê o repo e corre build/audit — não
# precisa de escrever nada. Evita herdar o default do repo (que pode ser
# read-write) se o GITHUB_TOKEN alguma vez for usado por engano.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: static/package-lock.json

      - run: npm ci

      - run: npm run build

      # Falha em advisories high/critical (o que nos apanhou desatualizados
      # da última vez); moderate/low com fix indisponível não bloqueiam CI.
      - run: npm audit --audit-level=high
