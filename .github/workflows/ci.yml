name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: static/package-lock.json

      - run: npm ci

      - run: npm run build

      # Falha em advisories high/critical (o que nos apanhou desatualizados
      # da última vez); moderate/low com fix indisponível não bloqueiam CI.
      - run: npm audit --audit-level=high
