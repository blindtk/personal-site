# Confirma de fora, uma vez por mês, o que o Qualys SSL Labs já reporta
# (protocolos, cifras, certificado, vulnerabilidades conhecidas) — sem
# depender de um serviço terceiro individual estar no ar nem esperar pelo
# cache dele. Mensal, não semanal: a superfície TLS (cifras, protocolo,
# certificado) muda raramente — mais cadência não detetava nada mais cedo.
# O scan corre via a imagem Docker oficial
# do testssl.sh, pinada por digest — a mesma disciplina de pin exato do
# resto do repo (actions por SHA), aplicada aqui a uma imagem em vez de uma
# action, porque testssl.sh não é distribuído como GitHub Action nem como
# pacote apt.
name: verify-tls

on:
  schedule:
    - cron: '11 8 3 * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a verificar (por omissão: a do expected-headers.json)'
        required: false
        type: string

permissions: {}

jobs:
  testssl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determinar alvo
        id: target
        env:
          # valor externo entra por env e nunca interpolado no run: — evita
          # injeção de template (auditado pelo zizmor)
          TARGET_URL: ${{ inputs.url }}
        run: |
          set -e
          # O alvo por omissão é a constante PROD_URL de target.mjs, como em
          # check-headers/check-invariants/check-observatory — não o `url` do
          # JSON, para que o ficheiro de dados não decida para onde vai o scan.
          # O JSON só serve de interruptor "produção já é verificável".
          cfg_url="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('.github/expected-headers.json','utf8')).url)")"
          if [ -z "$TARGET_URL" ] && [[ "$cfg_url" == SET-ME* ]]; then
            echo "::warning::tls-check: URL de produção por definir em .github/expected-headers.json — verificação IGNORADA (nada foi verificado nesta execução)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="$(node --input-type=module -e "import { resolveTarget } from './.github/scripts/lib/target.mjs'; const u = resolveTarget(process.argv[1]); if (!u) { console.error('::error::tls-check: o alvo não é um URL válido.'); process.exit(1); } console.log(u.href)" "$TARGET_URL")"
          host="$(node -e "console.log(new URL(process.argv[1]).host)" "$url")"
          # $HOST é o último argumento posicional do testssl.sh: um host a
          # começar por "-" seria lido como opção.
          case "$host" in -*) echo "::error::tls-check: host inválido."; exit 1 ;; esac
          # O CI_WAF_TOKEN só vai para a origem de produção — a mesma regra
          # de check-headers/check-invariants (isProductionTarget em
          # .github/scripts/lib/target.mjs). Antes ia para qualquer host
          # passado no input do workflow_dispatch (auditoria de segurança
          # 2026-09-25).
          waf="$(node --input-type=module -e "import { isProductionTarget } from './.github/scripts/lib/target.mjs'; console.log(isProductionTarget(new URL(process.argv[1])))" "$url")"
          {
            echo "host=$host"
            echo "waf=$waf"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Correr testssl.sh
        if: steps.target.outputs.skip == 'false'
        env:
          # Segredo do bypass da regra WAF "CI headers check" (docs/
          # cloudflare-deploy.md §5, regra 2) — as checagens de
          # protocolo/cifra/vulnerabilidades do testssl.sh correm ao nível
          # TLS, ANTES de qualquer regra WAF (a Cloudflare completa o
          # handshake para qualquer cliente, incluindo os que a política de
          # país bloqueia, para poder avaliar o pedido HTTP a seguir) — só
          # os testes que fazem pedidos HTTP reais (--headers, HSTS) passam
          # pelo WAF. --reqheader replica nesses pedidos o mesmo header
          # x-ci-waf-token já usado por check-headers.mjs/
          # check-invariants.mjs, para não caírem na política de país
          # vindos de um runner do GitHub (normalmente fora de PT).
          CI_WAF_TOKEN: ${{ secrets.CI_WAF_TOKEN }}
          HOST: ${{ steps.target.outputs.host }}
          WAF_OK: ${{ steps.target.outputs.waf }}
        run: |
          set -e
          mkdir -p tls-report
          # Array em vez de expansão inline: o CodeRabbit assinalou a linha
          # anterior (${CI_WAF_TOKEN:+--reqheader "..."} sem aspas) como
          # word-splitting quebrado — verificado que, em bash, as aspas
          # literais dentro do :+ já são respeitadas na análise sintática
          # (não reproduz o bug descrito), mas o array evita depender dessa
          # subtileza e é mais fácil de auditar.
          args=(--quiet --jsonfile /data/testssl.json)
          if [ -n "$CI_WAF_TOKEN" ] && [ "$WAF_OK" = "true" ]; then
            args+=(--reqheader "x-ci-waf-token: ${CI_WAF_TOKEN}")
          fi
          # Imagem: drwetter/testssl.sh:3.2, pinada por digest (não há tag
          # nem SHA de commit aqui — testssl.sh não é uma GitHub Action).
          # Tag + digest na mesma linha: é o que o customManager do
          # renovate.json5 lê para manter ambos atualizados (docker run
          # dentro de um `run:` não tem manager nativo).
          # -u "$(id -u):$(id -g)": a imagem corre como um utilizador
          # próprio, diferente do dono (runner) do diretório montado — sem
          # isto, o scan corria (viu-se a nota A+ no log) mas a escrita de
          # /data/testssl.json falhava com "Permission denied", silenciosa
          # até o check-tls.mjs a seguir rebentar com ENOENT (achado numa
          # primeira execução real contra produção, 2026-08-02).
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/tls-report:/data" \
            drwetter/testssl.sh:3.2@sha256:c1a54a31bb596e09f79f91823468512e9c0794eb522340ff228875971514695c \
            "${args[@]}" \
            "$HOST"

      - name: Avaliar achados
        if: steps.target.outputs.skip == 'false'
        run: node .github/scripts/check-tls.mjs tls-report/testssl.json

      # O artefacto fica público 90 dias e o scan leva o CI_WAF_TOKEN em
      # --reqheader. O formato "flat" do --jsonfile não deve incluir a linha de
      # comando, mas isso não é verificável daqui: se o relatório contiver o
      # nome do header ou o valor do segredo, apaga-o e falha em vez de o
      # publicar.
      - name: Garantir que o relatório não contém o segredo
        if: always() && steps.target.outputs.skip == 'false'
        env:
          CI_WAF_TOKEN: ${{ secrets.CI_WAF_TOKEN }}
        run: |
          [ -f tls-report/testssl.json ] || exit 0
          if grep -qiF -e 'x-ci-waf-token' tls-report/testssl.json \
            || { [ -n "$CI_WAF_TOKEN" ] && grep -qF -e "$CI_WAF_TOKEN" tls-report/testssl.json; }; then
            rm -f tls-report/testssl.json
            echo "::error::tls-check: o relatório do testssl.sh continha o header/segredo do bypass WAF — apagado, não foi publicado."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.target.outputs.skip == 'false'
        with:
          name: testssl-report
          path: tls-report/testssl.json
          retention-days: 90
