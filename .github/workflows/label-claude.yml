# Etiqueta automaticamente os PRs abertos a partir de sessões do Claude Code.
# Os branches do Claude seguem sempre o prefixo `claude/*`; quando um PR desses
# é aberto ou reaberto, aplica a label "claude" (a mesma que já existe no repo).
# Server-side de propósito: não depende de a sessão se lembrar de o fazer.
name: Label Claude PRs

on:
  pull_request:
    types: [opened, reopened]

# Nada por omissão — o job declara só o que precisa (ver ci.yml).
permissions: {}

jobs:
  label:
    # Só os branches do Claude; ignora todo o resto sem gastar um runner à toa.
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Aplicar label claude
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --add-label claude
