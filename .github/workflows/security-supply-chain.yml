# Verificações de supply-chain: semanal + à mão, e também nos PRs que mexem
# num dos lockfiles (os do Renovate, quase sempre). Semanal sozinho deixava
# um pacote servido sem assinatura válida entrar na main e só ser apanhado
# até 7 dias depois — o PR que muda o lockfile é exatamente o momento em que
# `npm audit signatures` tem algo novo para verificar. PRs sem lockfile não
# o correm (paths); o SBOM só é guardado fora de PRs (docs/ci-cd.md,
# "Cadence"). Cobre os dois lockfiles (static/ e dynamic/worker/), mesma
# lógica de "dois jobs" do osv-scanner/ci.yml.
name: security-supply-chain

on:
  schedule:
    # Segunda de manhã, semanal. A hora é nominal: os crons deste repo
    # arrancam 5–8 h depois do agendado (docs/ci-cd.md, "Cadence") — não
    # há ordem garantida face à janela do Renovate; as alterações de
    # lockfile do Renovate já são verificadas no próprio PR (abaixo).
    - cron: '0 6 * * 1'
  # Nunca o tornar check obrigatório no ruleset: com `paths`, um PR que não
  # mexe em lockfiles ficava à espera de um check que nunca chega.
  pull_request:
    branches: [main]
    paths:
      - 'static/package-lock.json'
      - 'dynamic/worker/package-lock.json'
  workflow_dispatch: {}

permissions: {}

# Um push novo num PR cancela a execução anterior desse PR (o resultado já
# não interessa). Fora de PRs o grupo é o próprio run (run_id): pushes para
# main e crons nunca se cancelam nem ficam à espera uns dos outros.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: static/package-lock.json
      - run: npm ci --ignore-scripts

      # Verifica as assinaturas de registo do npm (e attestations de
      # provenance, quando existem) contra as chaves públicas do próprio
      # registo — deteta um pacote servido sem a assinatura esperada
      # (registo comprometido, mirror adulterado, etc.). Independente do
      # OSV-Scanner/gitleaks/Semgrep (que olham para vulnerabilidades e
      # segredos, não para a integridade da distribuição).
      - name: npm audit signatures
        run: npm audit signatures

      # SBOM (CycloneDX) do que está de facto instalado. `npm sbom` lê o
      # lockfile + node_modules, por isso corre depois do `npm ci` acima.
      - name: Gerar SBOM
        if: github.event_name != 'pull_request'
        run: npm sbom --sbom-format cyclonedx > sbom-static.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: sbom-static
          path: static/sbom-static.cdx.json
          retention-days: 90

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dynamic/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dynamic/worker/package-lock.json
      - run: npm ci --ignore-scripts
      - name: npm audit signatures
        run: npm audit signatures
      - name: Gerar SBOM
        if: github.event_name != 'pull_request'
        run: npm sbom --sbom-format cyclonedx > sbom-worker.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: sbom-worker
          path: dynamic/worker/sbom-worker.cdx.json
          retention-days: 90
