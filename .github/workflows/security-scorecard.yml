# OpenSSF Scorecard: mede postura de supply-chain (pins por SHA, permissions
# mínimas, branch protection, workflows perigosos como pull_request_target,
# …) — não encontra bugs de código, mede práticas. Aqui é sobretudo trabalho
# já feito à mão (ver security.yml, zizmor); o valor do Scorecard é impedir
# regressão e publicar um badge verificável, não descobrir algo novo.
#
# Resultado em Security → Code scanning (SARIF) e no dashboard público
# securityscorecards.dev (publish_results). Ambos só possíveis com o
# repositório público — ver a revisão de segurança de 2026-07-29 (não publicada), §4
# "OpenSSF Scorecard".
name: security-scorecard

on:
  schedule:
    # Sábado de madrugada — fora da janela de PRs da semana, sem colidir
    # com verify-headers (17 6 diário), verify-worker (43 7 diário),
    # security-supply-chain (0 6 * * 1) ou security-codeql (30 5 * * 1).
    - cron: '30 5 * * 6'
  workflow_dispatch: {}

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # obrigatório para assinar e publicar os resultados (Sigstore) no
      # dashboard público do OpenSSF.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Correr análise Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Guardar SARIF como artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Publicar em Security → Code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
