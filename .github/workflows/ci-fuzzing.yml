# ClusterFuzzLite (Jazzer.js) sobre sanitizeText()/escapeHtml()
# (dynamic/worker/src/lib/sanitize.js) — os sanitizadores clássicos de
# output derivado de fontes externas, e a única fronteira de confiança do
# Worker que ainda faz sentido fuzzar (o outro harness, sobre o recetor de
# relatórios CSP, foi removido junto com esse pipeline — ver
# dynamic/PLAN.md). Ao contrário das ferramentas client-side de
# /ferramentas/ (sem rede, sem fronteira de confiança real), esta função
# processa bytes vindos de fora sem confiança prévia — daí ser o alvo.
#
# Curto (60-120s): o objetivo é o Scorecard reconhecer a integração de
# fuzzing, não substituir os testes com vetores conhecidos já existentes
# (node --test).
#
# Semanal + à mão. Esteve só em workflow_dispatch enquanto falhava sempre,
# por duas causas, ambas resolvidas em .clusterfuzzlite/
# (2026-10-01, reproduzidas localmente com as mesmas imagens):
# 1. sanitizer: coverage faz o compile do OSS-Fuzz copiar $SRC para
#    $OUT/src, incluindo o honggfuzz da imagem base; o run_fuzzers
#    apanhava os wrappers hfuzz_cc/* como alvos, que "crashavam" sempre
#    (execvp('clang'): No such file or directory). O Dockerfile apaga
#    $SRC/honggfuzz antes do compile.
# 2. O Jazzer.js 4.0.0 traz o addon nativo compilado contra glibc 2.38, e
#    a imagem do run_fuzzers (Ubuntu 20.04) só tem 2.31 — o harness real
#    nem arrancava ("GLIBC_2.32 not found"). Fixado no 2.1.0 com o
#    prebuild verificado por SHA-256 (ver build.sh, incluindo a limitação
#    de cobertura com ESM).
# O cron voltou depois de 4 execuções manuais verdes seguidas (runs #2–#5,
# 2026-10-01). O Renovate retém o major do @jazzer.js/core até a imagem do
# run_fuzzers ter glibc >= 2.38 (renovate.json5).

name: ci-fuzzing

on:
  schedule:
    # Domingo de madrugada — fora da janela dos outros crons semanais.
    - cron: '20 4 * * 0'
  workflow_dispatch: {}

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          # Jazzer.js corre em cima do V8/Node, não código nativo — não há
          # instrumentação ASan possível. O script de compile do OSS-Fuzz só
          # aceita 'coverage' ou 'none' para language: javascript (falha com
          # "cannot be fuzzed with sanitizers" para qualquer outro valor —
          # visto na 1.ª execução em produção, run #1 de 2026-08-01), mas o
          # próprio wrapper desta action só reconhece
          # address/memory/undefined/coverage como SANITIZER válido (rejeita
          # 'none' com "Invalid Configuration" — visto na 2.ª execução,
          # workflow_dispatch manual). 'coverage' é o único valor aceite por
          # ambas as camadas.
          sanitizer: coverage

      - name: Correr fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 1 harness (sanitize_fuzz).
          fuzz-seconds: 120
          mode: 'batch'
          output-sarif: true
