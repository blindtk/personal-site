# Hooks locais de git — travam segredos ANTES de saírem da máquina
# (o job gitleaks do CI volta a verificar; isto é a primeira linha).
#
# Ativação (uma vez, na raiz do repo):
#   pipx install pre-commit        # ou: pip install --user pre-commit
#   pre-commit install
#
# A partir daí o gitleaks corre automaticamente em cada `git commit`.
# Para correr à mão sobre tudo: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
