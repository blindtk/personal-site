# Cloudflare Worker das features de segurança. Ver README.md.
name = "personal-site-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Sem subdomínio *.workers.dev nem preview URLs: o deploy final vive só nas
# rotas do domínio (routes abaixo). Um *.workers.dev público contornava a
# Access application e o WAF da zona, que só cobrem danielmala.co.
workers_dev = false
preview_urls = false

# --- Rotas no domínio ---
# Faz o Worker interceptar os paths-isco e a API no próprio site, mantendo
# a CSP connect-src 'self'. O resto do site continua servido pelo Pages.
# Tem de ficar antes do [vars] abaixo: em TOML, uma chave solta depois de
# abrir uma tabela ([vars]) pertence a essa tabela — foi assim que "routes"
# acabou a ser lido como env.routes (variável), em vez da config de rotas.
routes = [
  { pattern = "danielmala.co/api/*", zone_name = "danielmala.co" },
  { pattern = "danielmala.co/wp-login.php", zone_name = "danielmala.co" },
  { pattern = "danielmala.co/.env", zone_name = "danielmala.co" },
  { pattern = "danielmala.co/admin", zone_name = "danielmala.co" },
  { pattern = "danielmala.co/phpmyadmin/*", zone_name = "danielmala.co" },
  { pattern = "danielmala.co/.git/config", zone_name = "danielmala.co" },
]

# Um namespace KV. Cria-o e cola o id:
#   npx wrangler kv namespace create HONEYPOT
#   npx wrangler kv namespace create HONEYPOT --preview
[[kv_namespaces]]
binding = "KV"
id = "d8c992d39f464bca85135f014d3ca37b"
preview_id = "6ecf59e3f7a742748e4cc22c229543c3"

[vars]
# Origens autorizadas a chamar a API por CORS (só necessário quando o
# frontend está noutra origem, ex.: *.pages.dev a chamar *.workers.dev).
# No deploy final (Worker em rotas do próprio domínio) fica vazio — as
# chamadas são same-origin e a CSP connect-src 'self' basta.
ALLOWED_ORIGINS = ""
# Alvo do self-scan (o próprio site). O vigia CT (/api/ct) deriva daqui o
# domínio a vigiar nos logs de Certificate Transparency.
SCAN_TARGET = "https://danielmala.co/"
# Emissores esperados no vigia CT (CSV, match por substring). Vazio = a
# lista por omissão em src/lib/ct.js (Let's Encrypt + Google Trust
# Services, o par primário/backup que a Cloudflare usa). Qualquer
# certificado de outro emissor aparece como "inesperado" no painel.
CT_EXPECTED_ISSUERS = ""
# Marca temporal do deploy (epoch ms) para "tempo até 1.º scan". Opcional:
# se vazio, usa a 1.ª tentativa registada. Define no deploy, ex.:
#   npx wrangler deploy --var DEPLOY_TS:$(date +%s000)
DEPLOY_TS = ""
# IDs da zona/conta para o painel "Estado da Cloudflare" (/api/cf-stats,
# GraphQL Analytics API — NÃO o Radar, ver src/lib/cf-analytics.js). Não
# são segredos (identificam a zona/conta, não dão acesso sozinhos), mas sem
# eles a rota fica desativada (502 → painel mostra o fallback). IDs em
# dash.cloudflare.com → domínio → Visão geral, secção "API" no fundo da
# página lateral direita.
CF_ZONE_TAG = "b06be445835cdfec46c6084badf84d5c"
CF_ACCOUNT_ID = "336ca891b77258bead7b06fb0f9a28da"
# Nome do script deste Worker na conta. Bate com `name` no topo deste
# ficheiro — só precisa de mudar se um dos dois for renomeado.
CF_WORKER_SCRIPT = "personal-site-worker"

# Secrets (NÃO ficam aqui — o gitleaks do CI apanha qualquer deslize):
#   npx wrangler secret put RATE_SALT    # segredo p/ o hash de rate limit
#   npx wrangler secret put NVD_API_KEY  # opcional, sobe o rate limit do NVD
#   npx wrangler secret put CF_API_TOKEN # token criado em dash.cloudflare.com → Meu perfil → Tokens de API
#     · Base (pedidos/cache/ameaças/país/código HTTP, 7d): "Account
#       Analytics:Read" + "Zone Analytics:Read".
#     · Eventos de firewall por ação/origem (24h, firewallEventsAdaptive CRU):
#       juntar as permissões de leitura de firewall — "Zone Firewall
#       Services:Read", "Zone WAF:Read" e "Account Firewall Access Rules:Read".
#       Sem elas o sub-pedido é best-effort e as tabelas de firewall ficam
#       vazias, mas o painel-base mantém-se. NOTA: o dataset AGREGADO
#       (firewallEventsAdaptive**Groups**) é Pro+ e no Free dá "does not have
#       access to the path" — por isso usamos o cru e agregamos no Worker.
#       Ver src/lib/cf-analytics.js e dynamic/PLAN.md.
#
# Rotação do RATE_SALT: rodar SEMANALMENTE. Trocar o segredo invalida de
# imediato TODOS os rate-limits acumulados (o hash deixa de bater) — é
# intencional, o botão de pânico contra abuso. A rotação diária do hash é
# automática (salt = RATE_SALT + data UTC); esta é a rotação do próprio
# segredo. Ver src/lib/ratelimit.js.

# --- Cron opcional para aquecer caches (a agregação do honeypot é on-read) ---
# [triggers]
# crons = ["*/30 * * * *"]
