# Ponto de partida para a GitHub Action a colocar no repo blindtk/github-stars
# (em .github/workflows/catalog.yml nesse repo — NÃO neste).
#
# Ajusta os passos "Run star-organizer" ao que a ferramenta realmente é
# (Python? Node? binário?). O resto — schedule, dispatch, commit condicional —
# está pronto.

name: Update stars catalog

on:
  schedule:
    - cron: '0 6 * * 1' # todas as segundas às 06:00 UTC
  workflow_dispatch: {} # botão "Run workflow" no separador Actions

permissions:
  contents: write # necessário para o commit do catálogo

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- ADAPTA ESTA SECÇÃO à linguagem do star-organizer ---
      # Exemplo (Python):
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
      # - run: pip install -r requirements.txt
      #
      # Exemplo (Node):
      # - uses: actions/setup-node@v4
      #   with: { node-version: '22' }
      # - run: npm ci

      - name: Run star-organizer
        env:
          # Token com scope de leitura de estrelas públicas do utilizador.
          # O GITHUB_TOKEN default chega para ler estrelas públicas.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Substitui pela invocação real; deve escrever catalog/catalog.json
          # para o utilizador blindtk, no schema de docs/catalog-contract.md.
          echo "TODO: correr a ferramenta para o user blindtk e gerar catalog/catalog.json"
          # ex.: python star_organizer.py --user blindtk --json catalog/catalog.json

      - name: Commit catalog if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain catalog/catalog.json)" ]; then
            git add catalog/catalog.json
            git commit -m "chore: update stars catalog ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Catálogo sem alterações — nada para commitar."
          fi

      # --- OPCIONAL: forçar rebuild do site em Cloudflare Pages ---
      # - name: Trigger site rebuild
      #   if: success()
      #   run: curl -fsSL -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK }}"
